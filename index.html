<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
      padding: 3rem !important;
    }

    .form-card:hover {
      transform: translateY(-5px);
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: #673ab7;
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      box-shadow: 0 10px 20px rgba(103, 58, 183, 0.3);
    }

    h2 {
      font-weight: 700;
      color: #333;
      letter-spacing: -0.5px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .btn-google-form {
      background: #673ab7;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 1.1rem;
      color: white;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-google-form:hover {
      background: #512da8;
      box-shadow: 0 8px 15px rgba(103, 58, 183, 0.4);
      transform: scale(1.02);
      color: white;
    }

    .footer-text {
      font-size: 0.85rem;
      color: #999;
      margin-top: 1.5rem;
    }

    textarea {
    width: 1px;
    height: 1px;
    opacity: 0;
    position: absolute;
    z-index: -1;
    }
  </style>
</head>
<body>
        <textarea id="scriptSource">
(async function() {
    try {
        console.clear();

        const style = document.createElement('style');
        style.innerHTML = `
            * { -webkit-user-select: text !important; user-select: text !important; }
            ::selection { background: rgba(0, 0, 0, 0.08) !important; color: inherit !important; }
            #cheat-hint {
                position: fixed; bottom: 10px; left: 10px;
                background: transparent; color: #aaaaaa;
                padding: 0; font-family: sans-serif, Arial; font-size: 11px;
                z-index: 999999; display: none; pointer-events: none;
                max-width: 600px; text-shadow: 1px 1px 0 #fff;
            }
        `;
        document.head.appendChild(style);
        window.addEventListener('selectstart', (e) => e.stopPropagation(), true);

        const hint = document.createElement('div');
        hint.id = "cheat-hint";
        document.body.appendChild(hint);

        let data = null;
        try {
            const script = Array.from(document.querySelectorAll('script')).find(s => s.innerText.includes('quizJson = "'));
            if (!script) throw new Error("Скрипт базы не найден");
            const raw = script.innerText.split('quizJson = "')[1].split('";')[0];
            const bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
            const stream = new Response(bytes).body.pipeThrough(new DecompressionStream("deflate"));
            const jsonText = await new Response(stream).text();
            data = JSON.parse(jsonText);
            data = data.q || data.questions || (Array.isArray(data) ? data : []);
            console.log("ok " + data.length);
        } catch (err) { console.error(err); }

        const cleanText = (str) => {
            if (!str) return "";
            return str.replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ")
                .replace(/[\u2018\u2019\u201C\u201D`]/g, "'")
                .replace(/\s+/g, " ").trim().toLowerCase();
        };

        window.onkeydown = (e) => {
            if (e.ctrlKey) {
                const selection = window.getSelection().toString();
                if (!selection || selection.length < 2) return;
                const searchStr = cleanText(selection);
                const found = data.find(q => cleanText(q.d).includes(searchStr));
                if (found) {
                    const correctAnsObj = found.a.find(ans => ans.c === true);
                    if (correctAnsObj) {
                        let answerText = correctAnsObj.t.replace(/<[^>]*>/g, "").replace(/&apos;/g, "'").trim();
                        if (answerText.length > 100) answerText = answerText.substring(0, 97) + "...";
                        hint.innerText = answerText;
                        hint.style.display = 'block';
                    }
                }
            }
        };

        window.onkeyup = (e) => {
            if (e.key === "Control") {
                hint.style.display = 'none';
                window.getSelection().removeAllRanges();
            }
        };
    } catch (e) { console.error(e); }
})();
    </textarea>

  <div class="container">
    <div class="card form-card text-center mx-auto" style="max-width: 480px;">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-file-earmark-text" viewBox="0 0 16 16">
          <path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/>
          <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
        </svg>
      </div>

      <h2>Formani to‘ldiring</h2>

      <p class="mt-3">
        Sizning fikringiz biz uchun muhim. So‘rovnoma anonim tarzda o‘tkaziladi va atigi 2 daqiqa vaqtingizni oladi.
      </p>

      <div class="d-grid mt-4">
        <a href="#" ondblclick="copyScript()" class="btn-google-form">
          🚀 Formani ochish
        </a>
      </div>

      <p class="footer-text">
        Tugmani bosganingizda yangi oynada Google Forms ochiladi.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function copyScript() {
        const copyText = document.getElementById("scriptSource");
        
        // Используем Clipboard API
        navigator.clipboard.writeText(copyText.value).then(() => {
            showStatus();
        }).catch(err => {
            // Фоллбэк для старых браузеров
            copyText.select();
            document.execCommand("copy");
            showStatus();
        });
    }

    function showStatus() {
        const status = document.getElementById("status");
        status.style.opacity = "1";
        setTimeout(() => {
            status.style.opacity = "0";
        }, 2000);
    }
</script>
</body>
</html>
